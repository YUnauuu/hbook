# hbook, one container.
#
#   curl -O https://raw.githubusercontent.com/YUnauuu/hbook/main/deploy/docker-compose.yml
#   docker compose up -d
#
# Then open http://localhost:8080 and create your admin account in the browser. There are no secrets to
# generate, no config file to edit, and no database to run: Postgres lives inside the container, on a unix
# socket, in the hbook_data volume. Leave DATABASE_URL unset and that is what you get; set it and the
# same image talks to a database you run yourself instead (docker-compose.external-db.yml is that layout,
# ready to use). The two share every other volume, and docs/MIGRATING.md has the move in both directions.
#
# The extension engine is Suwayomi-Server, run headless -- you never use its own interface -- and it runs the
# Mihon/Tachiyomi extensions. It ships ON, as its own container because it is a JVM, capped at 2 GB below.
# MangaDex and sites you add by URL work without it: put EXTENSION_ENGINE=0 in .env and run
# `docker compose up -d`, and the whole thing is one container plus the Cloudflare solver. Its data is kept;
# delete the line and run the same command to bring it back.
#
#   EXTENSION_ENGINE=0               don't run the extension engine (default 1)
#   LIBRARY_PATH=/mnt/media/comics   your existing library (default: ./library)
#   PUID= / PGID=                    run as the user that OWNS your library, so hbook can rename and
#                                    delete files in it. `id -u` and `id -g`. Leave both unset and nothing
#                                    changes: the app runs as uid 10002 and your library is read-only.
#   WEB_PORT=8080                    the port you open in a browser

services:
  hbook:
    image: ghcr.io/yunauuu/hbook:latest
    container_name: hbook
    restart: unless-stopped
    # The app finishes the chapter it is writing on SIGTERM (up to 20 s), and then Postgres checkpoints and
    # stops. Docker's default 10 s would kill the database mid-checkpoint.
    stop_grace_period: 40s
    environment:
      # Run as the owner of your library so file operations work. Unset = uid 10002, library read-only.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      NODE_ENV: production
      # How much the log says (v0.92.0): info, warn, or debug for what Find other sources searched and why.
      LOG_LEVEL: ${LOG_LEVEL:-}
      PORT: "3000"
      # No DATABASE_URL: that is the switch. Set one here and the embedded database is not started.
      LIBRARY_BACKEND: ${LIBRARY_BACKEND:-owned}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # The Cloudflare solver. The env var keeps its name because the API is the FlareSolverr API; the
      # container behind it is trawl now (see hbook-trawl below).
      FLARESOLVERR_URL: http://hbook-trawl:8191
      # How many solves may be in flight at once. Four is right for a machine with a browser to spare;
      # two is right for a 2 GB one, where the solver has one browser and a solve takes seconds.
      SOLVER_CONCURRENCY: ${SOLVER_CONCURRENCY:-2}
      # The image cache. 8 GiB, not the 16 GiB the app defaults to: on a 40 GB disk the library and the
      # database want room too, and a cache is safe to delete (it refills).
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-8589934592}
      SOURCES_DIR: /sources
      # When the solver cannot answer -- and on a small machine it is busy most of the time --
      # fetch the page DIRECTLY instead of giving the source up on it. Most of the Chinese manga sites
      # put no challenge in front of their pages, so this is the difference between a slow source and
      # a dead one. The development compose and the start script have said this all along.
      SOURCE_DIRECT_FETCH: ${SOURCE_DIRECT_FETCH:-1}
      # The novel side's book-source collections. The image carries them at /app/novel-sources;
      # point this at a folder of your own to replace them (mount it, then name it here).
      NOVEL_SOURCES_PATH: ${NOVEL_SOURCES_PATH:-/app/novel-sources}
      CUSTOM_SITES_FILE: /config/sites.json
      # Generated and persisted to /config on first boot when left empty.
      JWT_SECRET: ${JWT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_ALLOW_SIGNUP: ${OIDC_ALLOW_SIGNUP:-false}
      OIDC_LINK_BY_USERNAME: ${OIDC_LINK_BY_USERNAME:-false}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      # SSO-only sign-in (v0.63.0): AUTH_MODE=oidc-only makes the provider the only way in. See docs/api.md, SSO-only mode.
      AUTH_MODE: ${AUTH_MODE:-local}
      OIDC_BOOTSTRAP_ADMIN_SUB: ${OIDC_BOOTSTRAP_ADMIN_SUB:-}
      AUTH_RESCUE_ADMIN: ${AUTH_RESCUE_ADMIN:-}
      # Extension engine (Mihon/Tachiyomi extensions). EXTENSION_ENGINE=0 in .env turns it off and drops the
      # container below (it is a JVM and costs about 800 MB); SUWAYOMI_URL points at a Suwayomi you run yourself
      # instead. The single dash is deliberate: `:-` treats an empty value as unset, so the documented
      # `SUWAYOMI_URL=` never turned anything off.
      SUWAYOMI_URL: ${SUWAYOMI_URL-http://hbook-suwayomi:4567}
      EXTENSION_ENGINE: ${EXTENSION_ENGINE:-1}
      SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME:-}
      SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD:-}
      SUWAYOMI_MAX_SOURCES: ${SUWAYOMI_MAX_SOURCES:-25}
      SUWAYOMI_PAGE_CONCURRENCY: ${SUWAYOMI_PAGE_CONCURRENCY:-4}
    volumes:
      - ${LIBRARY_PATH:-./library}:/library      # your existing comics (see PUID above)
      - ${SOURCES_PATH:-./sources}:/sources:ro   # optional built source pack
      - hbook_data:/data                      # the embedded database (Postgres, in /data/pg)
      - hbook_downloads:/library-dl           # chapters hbook downloads
      - hbook_config:/config                  # secrets, custom sites, art overrides
      - hbook_cache:/cache                    # image cache (safe to delete)
      - ${BACKUP_PATH:-hbook_backups}:/backups
    ports:
      - "${WEB_PORT:-8080}:3000"
    networks: [hbook_app]

  # Cloudflare solver. Most manga aggregators sit behind Cloudflare, so the fetching half needs this.
  #
  # Cloudflare solver: trawl (Camoufox, a patched Firefox). It speaks the same API as FlareSolverr does --
  # hbook asks it for a solve and gets a page back, the same way -- and it is far lighter: about 316 MB
  # idle against FlareSolverr's 865 MB, measured on the same install, with a median solve of 2 s against
  # 12 s because it keeps the sessions it has already solved. That is what lets the whole stack -- app,
  # database, solver and extension engine -- live on a 2 GB machine.
  #
  # The version is PINNED: trawl is young and changes quickly, and a solver that changes under the app is a
  # solver that breaks under the app. `docker compose pull` and a new pin is the upgrade.
  hbook-trawl:
    image: ghcr.io/germondai/trawl:1.11.1
    container_name: hbook-trawl
    restart: unless-stopped
    # The browser writes its shared-memory segments here, and Docker's default /dev/shm is 64 MB. Under that,
    # the browser dies mid-challenge and the solver reports a session it cannot reach -- which looks, from
    # the app's side, exactly like the manga site blocking us.
    shm_size: 1gb
    # The ceiling: one browser sits around 320 MB and a solve takes a few hundred more. The cap turns an
    # unbounded leak into a restart (the restart policy above handles it) instead of letting it eat the
    # host -- the FlareSolverr image grew to 2.5 GB over 62 days on one install.
    mem_limit: ${SOLVER_MEM_LIMIT:-1200m}
    environment:
      # Solved sessions live in memory: no Redis beside it, on a machine this size.
      SESSION_CACHE_DRIVER: memory
      # One browser, not four: another browser is another ~320 MB. hbook asks for at most
      # SOLVER_CONCURRENCY solves at a time (2 above), so the rest wait their turn.
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-1}
    healthcheck:
      # /health answers 503 until a browser is up (15 to 30 s after a start), which is the only honest
      # signal it offers.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [hbook_app]
    expose:
      - "8191"

  # Optional: Mihon/Tachiyomi extensions. EXTENSION_ENGINE=0 in .env drops it (see the header). The tag is pinned and
  # moves only with a release that says so; the engine upgrades its data one way, so back it up first
  # (docs/extensions.md#updating-the-engine).
  hbook-suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
    container_name: hbook-suwayomi
    # The switch. EXTENSION_ENGINE=0 in .env, then `docker compose up -d`: this container is not run, and the app
    # (which reads the same variable) treats extensions as off. Its data stays in the volume; delete the line and
    # run the same command to bring it back where it left off. Never `docker compose down -v`, which deletes it.
    deploy:
      replicas: ${EXTENSION_ENGINE:-1}
    restart: unless-stopped
    # The engine is a JVM, and a JVM with no limit sizes its heap from the HOST's memory -- a quarter of it:
    # 15.7 GiB on a 62 GB machine, measured 2026-09-25 against this image -- so without a cap a small NAS is at
    # its mercy (discussion #72). JAVA_TOOL_OPTIONS below caps the heap at 512 MB with the serial collector, as
    # the desktop app does (desktop/src/engine.js). This ceiling has to hold the rest as well: Java's own native
    # memory, and the Chromium (the engine's WebView) and Xvfb that this image runs and the desktop app turns
    # off. Measured for #275, with 45 extensions on 12 cores: 1.4 GB after two days, 630 MB of it heap. Under
    # the old 1.5 GB ceiling it kept going only by swapping; a host with no swap (Unraid's default) kills it
    # there. The ceiling still turns a runaway into a restart, which the restart policy above handles.
    # SUWAYOMI_MEM_LIMIT and SUWAYOMI_JAVA_OPTS raise both; keep the ceiling at least 1.25 GB above -Xmx.
    mem_limit: ${SUWAYOMI_MEM_LIMIT:-1800m}
    environment:
      TZ: ${TZ:-UTC}
      # The heap cap itself. The image's startup script runs a bare `java -jar` with no options of its own, so
      # JAVA_TOOL_OPTIONS -- which every JVM reads when it starts -- is the way in.
      JAVA_TOOL_OPTIONS: "${SUWAYOMI_JAVA_OPTS:--Xmx512m -XX:+UseSerialGC -Dsuwayomi.tachidesk.config.server.kcefEnabled=false}"
      # Two malloc arenas instead of glibc's up to eight per CPU. Each thread that allocates gets an arena of its
      # own, and what it frees stays there: in #275's engine 94 arenas held 428 MB, and side by side under the
      # same load two held 120 MB less (measured 2026-10-16). Read by the C library, not the startup script.
      MALLOC_ARENA_MAX: "2"
      # hbook owns the library and does the downloading; this instance must never write into it. The
      # development compose has said so from the start and this file, the one people actually install from,
      # did not.
      AUTO_DOWNLOAD_CHAPTERS: "false"
      DOWNLOAD_AS_CBZ: "true"
      # The engine shares the bundled Cloudflare solver. Suwayomi has no browser of its own: a challenged
      # site makes it throw "Cloudflare bypass currently disabled" unless it is pointed at a FlareSolverr,
      # and it ships with that off. The image maps exactly these two variables into its server.conf.
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://hbook-trawl:8191
    volumes:
      - hbook_suwayomi:/home/suwayomi/.local/share/Tachidesk
    networks: [hbook_app]
    expose:
      - "4567"
    healthcheck:
      # The image has bash but no curl, wget or nc, so bash opens the socket itself. 401 counts as alive:
      # the engine is up, it just has authentication switched on. A JVM takes a while to come up, hence the
      # long start period; before this `docker ps` could not tell "still starting" from "broken".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4567; printf 'GET /api/v1/settings/about HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -qE ' (200|401) '"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  hbook_app:

volumes:
  hbook_data:       # the embedded database; back it up like any other volume, or rely on the nightly dump in /backups
  hbook_downloads:
  hbook_config:
  hbook_cache:
  hbook_backups:
  hbook_suwayomi:
